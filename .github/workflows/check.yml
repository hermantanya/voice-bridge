name: check

on:
  push:
    branches: [main]
  pull_request:

jobs:
  ship-gate:
    name: Ship gate (npm run check)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: |
            server/package-lock.json
            apps/mobile/package-lock.json

      - name: Install dependencies
        run: |
          npm ci --prefix server
          npm ci --prefix apps/mobile

      - name: Assert ship-gate files exist
        run: |
          set -euo pipefail
          required=(
            apps/mobile/scripts/verify-regressions.mjs
            apps/mobile/src/session/transcriptState.test.ts
            server/src/ws/latency.integration.test.ts
            server/src/ws/streamingPtt.integration.test.ts
            server/src/ws/join-room.integration.test.ts
          )
          for path in "${required[@]}"; do
            if [[ ! -f "$path" ]]; then
              echo "::error file=$path::Missing ship-gate file (CI would pass without this coverage)"
              exit 1
            fi
          done

      - name: npm run check
        run: npm run check
